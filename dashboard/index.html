<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetFP — Behavioral Network Fingerprinting Dashboard</title>
  <meta name="description" content="Real-time 3D visualization of network scan results from the NetFP behavioral fingerprinting tool." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Top bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <path d="M4.9 4.9l2.1 2.1M16.9 16.9l2.1 2.1M4.9 19.1l2.1-2.1M16.9 7.1l2.1-2.1"/>
        </svg>
      </div>
      <span class="brand-name">NetFP</span>
      <span class="brand-sub">Behavioral Network Fingerprinting</span>
    </div>
    <div class="topbar-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Waiting for data…</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btnRefresh" title="Refresh results">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Refresh
      </button>
      <button class="btn btn-ghost" id="btnExport" title="Export JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export
      </button>
    </div>
  </header>

  <!-- ── Main layout ────────────────────────────────────────── -->
  <main class="layout">
    <!-- 3D canvas -->
    <section class="canvas-wrap" id="canvasWrap">
      <canvas id="glcanvas"></canvas>
      <!-- Legend overlay -->
      <div class="legend">
        <div class="legend-item"><span class="dot linux"></span>Linux</div>
        <div class="legend-item"><span class="dot windows"></span>Windows</div>
        <div class="legend-item"><span class="dot bsd"></span>BSD/macOS</div>
        <div class="legend-item"><span class="dot virt"></span>Virtualized</div>
        <div class="legend-item"><span class="dot unknown"></span>Unknown</div>
      </div>
      <!-- Tooltip overlay -->
      <div class="node-tooltip" id="nodeTooltip" style="display:none;"></div>
    </section>

    <!-- Right side panel -->
    <aside class="side-panel">
      <!-- Stats bar -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-card">
          <div class="stat-val" id="statHosts">0</div>
          <div class="stat-lbl">Hosts</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statOpen">0</div>
          <div class="stat-lbl">Open Ports</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statVirt">0</div>
          <div class="stat-lbl">Virtualized</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statLB">0</div>
          <div class="stat-lbl">Load Bal.</div>
        </div>
      </div>

      <!-- Host list -->
      <div class="panel-section">
        <div class="section-header">
          <span>Discovered Hosts</span>
          <span class="badge" id="hostCount">0</span>
        </div>
        <div class="host-list" id="hostList"></div>
      </div>

      <!-- Raw JSON viewer -->
      <div class="panel-section json-section">
        <div class="section-header">
          <span>Raw Results</span>
          <button class="btn-tiny" id="btnCopyJson">Copy</button>
        </div>
        <pre class="json-viewer" id="jsonViewer"><span class="placeholder">// Waiting for scan data…</span></pre>
      </div>
    </aside>
  </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
